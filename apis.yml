name: Boon
description: >-
  Boon is an agile referral hiring platform that helps organizations source talent
  through employee, vendor, customer, and external referral networks. Using AI-driven
  semantic matching and proactive referral requests, Boon surfaces hidden candidates,
  manages reward and gamification programs, and syncs with existing HR/ATS tech stacks
  (Workday, Greenhouse, Lever, iCIMS, Ashby, JazzHR, Slack, Teams, and 50+ others).
  Founded in 2014 and backed by 500 Global and Redpoint Ventures, Boon markets faster
  time-to-hire and lower cost-per-hire through community-driven recruiting. This
  profile was seeded from VC portfolio data and enriched by the API Evangelist pipeline;
  Boon exposes a private integration API (api.goboon.co) but publishes no public
  OpenAPI or developer portal.
